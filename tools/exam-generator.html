<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">

    <meta name="twitter:card"       content="summary">
    <meta name="twitter:title"      content="إنشاء فروض واختبارات | مسار التميز">
    <meta name="twitter:description"content="أنشئ فروضاً واختبارات مدرسية جاهزة للطباعة حسب المستوى والمادة — للتلاميذ والأساتذة التونسيين.">

    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .tool-wrapper { max-width: 1100px; margin: 0 auto; padding: 40px 5% 80px; }
        .tool-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 40px; box-shadow: var(--shadow-md); }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .form-group { margin-bottom: 0; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 8px; }
        .form-group select { width: 100%; padding: 13px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--light-bg); color: var(--text); font-size: var(--font-size-base); font-family: var(--font-base); transition: border-color var(--transition-fast); }
        .form-group select:focus { outline: none; border-color: var(--primary); }

        .status-msg { text-align: center; font-weight: 500; min-height: 28px; margin-top: 20px; color: #10b981; }
        .status-msg.error { color: #ef4444; }

        /* معاينة الفرض */
        .exam-preview {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 50px;
            margin-top: 40px;
            box-shadow: var(--shadow-md);
            line-height: 2;
        }

        .exam-header {
            text-align: center;
            padding-bottom: 24px;
            border-bottom: 2px dashed var(--border);
            margin-bottom: 36px;
        }

        .exam-header h2 { color: var(--primary); margin-bottom: 6px; }
        .exam-header p  { color: var(--gray); }

        .question-item {
            margin-bottom: 30px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .question-item:last-child { border-bottom: none; }

        .question-text { font-weight: 600; margin-bottom: 12px; }

        .option-item {
            padding: 6px 0 6px 24px;
            color: var(--text);
        }

        .answer-line {
            height: 60px;
            background: var(--light-bg);
            border-radius: var(--radius-sm);
            margin-top: 12px;
            border: 1px dashed var(--border);
        }

        @media print {
            nav, footer, .no-print { display: none !important; }
            .exam-preview { box-shadow: none; border: none; }
            body { background: white; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="../index.html" class="logo"><img src="../assets/images/logo-nav.png" alt="مسار التميز" class="logo-img"></a>
        <div class="links">
            <a href="../index.html">الرئيسية</a>
            <a href="../tools/index.html" class="active">الأدوات</a>
            <a href="../legal/about.html">عن مسار</a>
            <a href="../contact.html">اتصل بنا</a>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="تبديل الوضع الليلي">🌙</button>
    </nav>

    <div class="hero">
        <h1>📝 إنشاء فروض واختبارات</h1>
        <p>أنشئ اختبارات وفروضاً مدرسية جاهزة للطباعة في ثوانٍ</p>
    </div>

    <main class="tool-wrapper">
        <div class="tool-card no-print">
            <div class="form-grid">
                <div class="form-group">
                    <label>المستوى الدراسي</label>
                    <select id="level">
                        <option value="">اختر المستوى</option>
                        <option value="ابتدائي">ابتدائي</option>
                        <option value="إعدادي">إعدادي</option>
                        <option value="ثانوي">ثانوي</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>المادة</label>
                    <select id="subject">
                        <option value="">اختر المادة</option>
                        <option value="رياضيات">رياضيات</option>
                        <option value="عربية">لغة عربية</option>
                        <option value="فرنسية">لغة فرنسية</option>
                        <option value="علوم">علوم</option>
                        <option value="تاريخ">تاريخ وجغرافيا</option>
                        <option value="إسلامية">تربية إسلامية</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>عدد الأسئلة</label>
                    <select id="questionCount">
                        <option value="5">5 أسئلة</option>
                        <option value="10" selected>10 أسئلة</option>
                        <option value="15">15 سؤال</option>
                        <option value="20">20 سؤال</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>نوع الاختبار</label>
                    <select id="examType">
                        <option value="اختبار">اختبار قصير</option>
                        <option value="فرض">فرض منزلي</option>
                        <option value="امتحان">امتحان فصلي</option>
                    </select>
                </div>
            </div>

            <div style="text-align: center; margin-top: 36px;">
                <button onclick="generateExam()" class="btn" style="padding: 14px 60px; font-size: 1.1rem;">
                    📄 إنشاء الفرض
                </button>
            </div>

            <p id="status" class="status-msg"></p>
        </div>

        <!-- معاينة الفرض -->
        <div id="examPreview" class="exam-preview" style="display:none;">
            <div class="exam-header">
                <h2 id="examTitle"></h2>
                <p id="examSubtitle"></p>
            </div>
            <div id="questionsContainer"></div>
            <div style="text-align:center; margin-top:50px;" class="no-print">
                <button onclick="window.print()" class="btn" style="background:#10b981; padding:13px 44px;">
                    🖨️ طباعة الفرض
                </button>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 <strong>مسار - تميّز</strong> | أدوات التلميذ الذكي</p>
        <p>جميع الحقوق محفوظة</p>
    </footer>

    <script>
        /* ─── السمة ─── */
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        const saved = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', saved);
        themeToggle.textContent = saved === 'dark' ? '☀️' : '🌙';
        themeToggle.addEventListener('click', () => {
            const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('theme', next);
        });

        /* ─── بيانات الأسئلة ─── */
        const questionBank = {
            رياضيات: [
                { q: 'ما هو ناتج ٢٥ × ٨؟',             opts: ['١٦٠', '٢٠٠', '١٨٠', '٢٢٠'] },
                { q: 'حل المعادلة: x + ١٥ = ٤٢',        opts: ['x = ٢٧', 'x = ٥٧', 'x = ٢٨', 'x = ٢٥'] },
                { q: 'ما هو مربع العدد ٩؟',              opts: ['٧٢', '٨١', '٦٣', '٩٠'] },
                { q: 'ما هو ناتج ١٤٤ ÷ ١٢؟',           opts: ['١١', '١٢', '١٣', '١٤'] },
                { q: 'ما هو المجموع: ٣/٤ + ١/٢؟',       opts: ['٥/٤', '٧/٤', '١', '٣/٢'] },
                { q: 'احسب محيط مربع طول ضلعه ٧ سم',    opts: ['٢٨ سم', '٤٩ سم', '٢١ سم', '١٤ سم'] },
                { q: 'ما هو ناتج ٥! (مضروب ٥)؟',        opts: ['١٢٠', '٦٠', '٢٤', '٢٤٠'] },
                { q: 'ما هو الجذر التربيعي لـ ٦٤؟',      opts: ['٦', '٧', '٨', '٩'] },
                { q: 'ما قيمة π تقريباً؟',               opts: ['٣.١٤', '٣.٤١', '٣.١٢', '٣.٢١'] },
                { q: 'احسب مساحة مثلث قاعدته ٦ وارتفاعه ٤', opts: ['١٢', '٢٤', '١٠', '٢٠'] },
            ],
            عربية: [
                { q: 'ما معنى كلمة "مُجتهد"؟',             opts: ['كسول', 'مجدّ', 'غاضب', 'فرحان'] },
                { q: 'استخرج المبتدأ في: الطالبُ ناجحٌ',   opts: null },
                { q: 'ما جمع كلمة "كتاب"؟',               opts: ['كُتُب', 'كُتّاب', 'أكتاب', 'كتابات'] },
                { q: 'أعرب كلمة "محمدٌ" في: جاء محمدٌ',    opts: null },
                { q: 'ما نوع الأسلوب: أكرِم الضيفَ!',       opts: ['خبري', 'إنشائي طلبي', 'نهي', 'استفهام'] },
                { q: 'ما مفرد كلمة "أطباء"؟',              opts: ['طبيب', 'طبّاء', 'طبيبة', 'طبّ'] },
                { q: 'ما نوع الجملة: الأمانةُ خُلُقٌ حسنٌ؟', opts: ['فعلية', 'اسمية', 'شرطية', 'ظرفية'] },
                { q: 'أكمل: الصبرُ مفتاحُ ...',             opts: null },
                { q: 'ما متضاد كلمة "الحزن"؟',             opts: ['الفرح', 'الألم', 'الغضب', 'الحب'] },
                { q: 'ما وزن كلمة "كاتب"؟',                opts: ['فاعل', 'فعّال', 'مفعول', 'فعيل'] },
            ],
            فرنسية: [
                { q: 'Conjugue "être" au présent pour "nous"', opts: ['sommes', 'êtes', 'suis', 'est'] },
                { q: 'Quel est le pluriel de "cheval"?',       opts: ['chevals', 'chevaux', 'chevales', 'chevauts'] },
                { q: 'Traduis: "Je vais à l\'école"',          opts: null },
                { q: 'Conjugue "avoir" au présent pour "ils"', opts: ['avons', 'avez', 'ont', 'as'] },
                { q: 'Quel est l\'article indéfini de "livre"?', opts: ['le', 'un', 'la', 'une'] },
                { q: 'Complète: Elle ___ étudiante (être)',     opts: ['est', 'es', 'suis', 'sommes'] },
                { q: 'Quel est l\'antonyme de "grand"?',       opts: ['petit', 'haut', 'large', 'fort'] },
                { q: 'Traduis: "Bonjour"',                     opts: ['Bonsoir', 'Salut', 'Bonjour = صباح الخير', 'Merci'] },
                { q: 'Quel est le féminin de "acteur"?',       opts: ['acteure', 'actrice', 'acteuresse', 'acteurette'] },
                { q: 'Conjugue "aller" au présent pour "je"',  opts: ['allons', 'allez', 'va', 'vais'] },
            ],
            علوم: [
                { q: 'ما وظيفة القلب في جسم الإنسان؟',         opts: null },
                { q: 'ما العضو الذي يقوم بعملية التمثيل الضوئي؟', opts: ['الجذر', 'الورقة', 'الساق', 'الزهرة'] },
                { q: 'ما الصيغة الكيميائية للماء؟',              opts: ['H2O', 'CO2', 'O2', 'NaCl'] },
                { q: 'ما المقياس المستخدم لقياس درجة الحرارة؟',  opts: ['كيلوغرام', 'سلسيوس', 'متر', 'أمبير'] },
                { q: 'ما الطاقة الناتجة عن الشمس؟',              opts: ['كيميائية', 'ضوئية وحرارية', 'كهربائية', 'حركية'] },
                { q: 'ما عدد نجوم المجموعة الشمسية؟',            opts: ['صفر', '١', '٨', '١٠٠'] },
                { q: 'ما نوع تكاثر الإنسان؟',                    opts: ['لاجنسي', 'جنسي', 'تبرعم', 'انشطار'] },
                { q: 'ما سرعة الضوء تقريباً؟',                   opts: ['٣٠٠ كم/ث', '٣٠٠٠٠٠ كم/ث', '١٠٠٠ كم/ث', '٣ كم/ث'] },
                { q: 'ما عضو الجسم المسؤول عن التنفس؟',          opts: ['القلب', 'الرئة', 'الكبد', 'الكلية'] },
                { q: 'ما البروتين الموجود في كريات الدم الحمراء؟', opts: ['الإنزيم', 'الهيموغلوبين', 'الكولاجين', 'الكيراتين'] },
            ],
        };

        const defaultQuestions = [
            { q: 'ما مفهوم هذا الموضوع؟', opts: null },
            { q: 'اشرح المقصود بـ...', opts: null },
            { q: 'قارن بين مفهومَين في هذه المادة', opts: null },
            { q: 'أعطِ مثالاً على...', opts: null },
            { q: 'ما الفرق بين... و...؟', opts: null },
        ];

        function generateExam() {
            const level   = document.getElementById('level').value;
            const subject = document.getElementById('subject').value;
            const count   = parseInt(document.getElementById('questionCount').value);
            const type    = document.getElementById('examType').value;
            const status  = document.getElementById('status');

            if (!level || !subject) {
                status.className = 'status-msg error';
                status.textContent = '⚠️ الرجاء اختيار المستوى والمادة أولاً';
                return;
            }

            status.className = 'status-msg';
            status.textContent = 'جاري إنشاء الفرض...';

            const bank = questionBank[subject] || defaultQuestions;
            let questions = [];
            while (questions.length < count) questions = [...questions, ...bank];
            questions = questions.slice(0, count);

            document.getElementById('examTitle').textContent = `${type} في مادة ${subject} — ${level}`;
            document.getElementById('examSubtitle').textContent =
                `عدد الأسئلة: ${count} | التاريخ: ${new Date().toLocaleDateString('ar-TN')}`;

            const container = document.getElementById('questionsContainer');
            container.innerHTML = questions.map((q, i) => `
                <div class="question-item">
                    <div class="question-text">${i + 1}. ${q.q}</div>
                    ${q.opts
                        ? q.opts.map((opt, j) => `
                            <div class="option-item">${String.fromCharCode(0x0623 + j)} . ${opt}</div>
                          `).join('')
                        : '<div class="answer-line"></div>'
                    }
                </div>
            `).join('');

            document.getElementById('examPreview').style.display = 'block';
            document.getElementById('examPreview').scrollIntoView({ behavior: 'smooth' });
            status.textContent = '✅ تم إنشاء الفرض بنجاح!';
        }
    </script>

</body>
</html>
