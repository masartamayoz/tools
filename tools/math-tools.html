<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أدوات الرياضيات | مسار</title>

<link rel="stylesheet" href="../assets/css/style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
.math-layout {
    display: grid;
    grid-template-columns: 250px 1fr;
    gap: 30px;
    margin-top: 40px;
}

.sidebar {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 20px;
    border: 1px solid var(--border);
}

.sidebar button {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    text-align: right;
}

.sidebar button.active,
.sidebar button:hover {
    background: var(--primary);
    color: white;
}

.tab { display:none; }
.tab.active { display:block; }
</style>

</head>

<body>

<nav>
    <a href="../index.html" class="logo">📚 <span>مسار</span></a>
    <div class="links">
        <a href="../index.html">الرئيسية</a>
        <a href="../tools/index.html">الأدوات</a>
    </div>
</nav>

<div class="hero">
    <h1>🔢 أدوات الرياضيات</h1>
</div>

<div class="container">

<div class="math-layout">

<!-- SIDEBAR -->
<div class="sidebar">
    <button onclick="showTab('table', this)" class="active">🧮 جدول الضرب</button>
    <button onclick="showTab('geometry', this)">📐 الهندسة</button>
    <button onclick="showTab('graph', this)">📈 الرسم</button>
    <button onclick="showTab('equation', this)">📊 المعادلات</button>
    <button onclick="showTab('units', this)">📏 الوحدات</button>
</div>

<div>

<!-- TABLE -->
<div id="table" class="tab active">
<div class="card">
<h3>🧮 جدول الضرب (1 → 9)</h3>
<button class="btn" onclick="fullTable()">عرض الجدول</button>
<div id="tableResult" style="margin-top:20px;"></div>
</div>
</div>

<!-- GEOMETRY -->
<div id="geometry" class="tab">
<div class="card">
<h3>📐 المساحات والمحيطات</h3>

<select id="shape">
<option value="square">مربع</option>
<option value="rectangle">مستطيل</option>
<option value="triangle">مثلث</option>
<option value="circle">دائرة</option>
</select>

<div id="inputs"></div>

<button class="btn" onclick="calcShape()">احسب</button>

<div id="geoResult" style="margin-top:15px;"></div>
</div>
</div>

<!-- GRAPH -->
<div id="graph" class="tab">
<div class="card">
<h3>📈 الرسم البياني</h3>

<input id="func" placeholder="مثال: x^2">

<button class="btn" onclick="drawGraph()">رسم</button>

<canvas id="chart"></canvas>
</div>
</div>

<!-- EQUATION -->
<div id="equation" class="tab">
<div class="card">
<h3>📊 المعادلات</h3>

<input id="eq" placeholder="2x + 3 = 11">

<button class="btn" onclick="solve()">حل</button>

<div id="eqResult"></div>
</div>
</div>

<!-- UNITS -->
<div id="units" class="tab">
<div class="card">
<h3>📏 الوحدات</h3>

<input id="val" type="number" value="100">
<select id="unit">
<option value="m">متر</option>
<option value="cm">سم</option>
<option value="km">كم</option>
</select>

<button class="btn" onclick="convert()">تحويل</button>

<div id="unitResult"></div>
</div>
</div>

</div>
</div>
</div>

<script>

/* Tabs */
function showTab(id, btn){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.getElementById(id).classList.add('active');

    document.querySelectorAll('.sidebar button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
}

/* ================= TABLE ================= */
function fullTable(){
    let html = "<table style='width:100%;text-align:center;border-collapse:collapse'>";
    html += "<tr><th>×</th>";

    for(let i=1;i<=9;i++){
        html += `<th>${i}</th>`;
    }
    html += "</tr>";

    for(let i=1;i<=9;i++){
        html += `<tr><th>${i}</th>`;
        for(let j=1;j<=9;j++){
            html += `<td style="border:1px solid var(--border);padding:6px">${i*j}</td>`;
        }
        html += "</tr>";
    }

    html += "</table>";
    document.getElementById("tableResult").innerHTML = html;
}

/* ================= GEOMETRY ================= */
const inputsDiv = document.getElementById("inputs");

document.getElementById("shape").addEventListener("change", renderInputs);

function renderInputs(){
    let shape = document.getElementById("shape").value;
    let html = "";

    if(shape=="square") html = `<input id="a" placeholder="الضلع">`;
    if(shape=="rectangle") html = `
        <input id="a" placeholder="الطول">
        <input id="b" placeholder="العرض">`;
    if(shape=="triangle") html = `
        <input id="b" placeholder="القاعدة">
        <input id="h" placeholder="الارتفاع">`;
    if(shape=="circle") html = `<input id="r" placeholder="نصف القطر">`;

    inputsDiv.innerHTML = html;
}
renderInputs();

function calcShape(){
    let s = document.getElementById("shape").value;
    let r="";

    if(s=="square"){
        let a=+a.value;
        r=`المساحة: ${a*a} | المحيط: ${4*a}`;
    }

    if(s=="rectangle"){
        let a=+document.getElementById("a").value;
        let b=+document.getElementById("b").value;
        r=`المساحة: ${a*b} | المحيط: ${2*(a+b)}`;
    }

    if(s=="triangle"){
        let b=+document.getElementById("b").value;
        let h=+document.getElementById("h").value;
        r=`المساحة: ${(b*h)/2}`;
    }

    if(s=="circle"){
        let r0=+document.getElementById("r").value;
        r=`المساحة: ${(Math.PI*r0*r0).toFixed(2)} | المحيط: ${(2*Math.PI*r0).toFixed(2)}`;
    }

    document.getElementById("geoResult").innerHTML=r;
}

/* ================= GRAPH ================= */
let chart;

function drawGraph(){
    let expr = document.getElementById("func").value.replace(/\^/g,"**");

    let x=[], y=[];

    for(let i=-10;i<=10;i+=0.5){
        x.push(i);
        y.push(eval(expr.replace(/x/g,`(${i})`)));
    }

    if(chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"),{
        type:"line",
        data:{
            labels:x,
            datasets:[{
                data:y,
                borderWidth:2,
                fill:false
            }]
        }
    });
}

/* ================= EQUATION ================= */
function solve(){
    let eq = document.getElementById("eq").value.replace(/\s/g,"");
    let [l,r]=eq.split("=");

    let a = eval(l.replace("x","1")) - eval(l.replace("x","0"));
    let b = eval(l.replace("x","0"));

    let x = (eval(r)-b)/a;

    document.getElementById("eqResult").innerHTML="x = "+x;
}

/* ================= UNITS ================= */
function convert(){
    let v=+document.getElementById("val").value;
    let u=document.getElementById("unit").value;

    let r="";
    if(u=="m") r=v*100+" cm";
    if(u=="cm") r=v/100+" m";
    if(u=="km") r=v*1000+" m";

    document.getElementById("unitResult").innerHTML=r;
}

</script>

</body>
</html>
