<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أدوات الرياضيات | مسار</title>

<style>
body {
  margin:0;
  font-family:"Segoe UI", sans-serif;
  background:#f4f6fb;
  direction:rtl;
}

/* LAYOUT */
.app {
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar {
  width:220px;
  background:#4f46e5;
  color:white;
  padding:20px;
}

.sidebar h2 {
  margin-bottom:20px;
}

.sidebar button {
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,0.1);
  color:white;
  cursor:pointer;
  text-align:right;
}

.sidebar button.active {
  background:white;
  color:#4f46e5;
}

/* CONTENT */
.content {
  flex:1;
  padding:30px;
}

/* CARD */
.card {
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 20px rgba(0,0,0,0.05);
  max-width:500px;
}

/* INPUT */
input, select {
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #ddd;
}

/* BUTTON */
.btn {
  width:100%;
  padding:12px;
  background:#4f46e5;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

/* RESULT */
.result {
  margin-top:15px;
  font-weight:bold;
}

/* HIDE */
.tab { display:none; }
.activeTab { display:block; }

</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>🔢 الرياضيات</h2>

  <button onclick="showTab('table', this)" class="active">جدول الضرب</button>
  <button onclick="showTab('equation', this)">المعادلات</button>
  <button onclick="showTab('units', this)">الوحدات</button>
  <button onclick="showTab('geometry', this)">الهندسة</button>
</div>

<!-- CONTENT -->
<div class="content">

<!-- 1. جدول الضرب -->
<div id="table" class="tab activeTab">
  <div class="card">
    <h3>🧮 جدول الضرب</h3>

    <select id="num">
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4" selected>4</option>
      <option value="5">5</option>
      <option value="6">6</option>
    </select>

    <button class="btn" onclick="table()">عرض</button>

    <div id="tableResult" class="result"></div>
  </div>
</div>

<!-- 2. المعادلات -->
<div id="equation" class="tab">
  <div class="card">
    <h3>📐 حل المعادلات</h3>

    <input id="eq" placeholder="مثال: 2x + 3 = 11">

    <button class="btn" onclick="solve()">حل</button>

    <div id="eqResult" class="result"></div>
  </div>
</div>

<!-- 3. الوحدات -->
<div id="units" class="tab">
  <div class="card">
    <h3>📏 تحويل الوحدات</h3>

    <input type="number" id="val" value="100">

    <select id="unit">
      <option value="m">متر</option>
      <option value="cm">سم</option>
      <option value="km">كم</option>
    </select>

    <button class="btn" onclick="convert()">تحويل</button>

    <div id="unitResult" class="result"></div>
  </div>
</div>

<!-- 4. الهندسة -->
<div id="geometry" class="tab">
  <div class="card">
    <h3>📐 مساحة المستطيل</h3>

    <input id="w" placeholder="العرض">
    <input id="h" placeholder="الطول">

    <button class="btn" onclick="rect()">احسب</button>

    <div id="geoResult" class="result"></div>
  </div>
</div>

</div>
</div>

<script>

/* TAB SYSTEM */
function showTab(id, btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('activeTab'));
  document.getElementById(id).classList.add('activeTab');

  document.querySelectorAll('.sidebar button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

/* TABLE */
function table(){
  let n = document.getElementById('num').value;
  let html="";
  for(let i=1;i<=10;i++){
    html += `${n} × ${i} = ${n*i}<br>`;
  }
  document.getElementById('tableResult').innerHTML = html;
}

/* EQUATION */
function solve(){
  try{
    let input = document.getElementById('eq').value.replace(/\s/g,'');
    let [l,r]=input.split('=');

    let a = eval(l.replace('x','1')) - eval(l.replace('x','0'));
    let b = eval(l.replace('x','0'));

    let x = (eval(r)-b)/a;

    document.getElementById('eqResult').innerHTML = "x = "+x;
  }catch{
    document.getElementById('eqResult').innerHTML="خطأ";
  }
}

/* UNITS */
function convert(){
  let v = parseFloat(document.getElementById('val').value);
  let u = document.getElementById('unit').value;

  let res="";
  if(u=="m") res = v*100+" cm";
  if(u=="cm") res = v/100+" m";
  if(u=="km") res = v*1000+" m";

  document.getElementById('unitResult').innerHTML=res;
}

/* GEOMETRY */
function rect(){
  let w = document.getElementById('w').value;
  let h = document.getElementById('h').value;

  let area = w*h;
  let p = 2*(+w + +h);

  document.getElementById('geoResult').innerHTML =
    "المساحة: "+area+" | المحيط: "+p;
}

</script>

</body>
</html>
