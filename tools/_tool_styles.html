<style>
        /* ─── أنماط مشتركة لصفحات الأدوات ─── */
        .tool-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 5% 80px;
        }

        .tool-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-md);
        }

        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color var(--transition-base), background var(--transition-base);
        }

        .upload-zone:hover,
        .upload-zone.dragging {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.04);
        }

        .upload-zone input[type="file"] { display: none; }

        .upload-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
        }

        .upload-zone p {
            color: var(--gray);
            margin-top: 8px;
            font-size: var(--font-size-sm);
        }

        .status-msg {
            text-align: center;
            font-weight: 500;
            min-height: 28px;
            margin-top: 20px;
            color: #10b981;
            transition: color var(--transition-fast);
        }

        .status-msg.error { color: #ef4444; }

        .faq-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-sm);
            margin-top: 40px;
        }

        .faq-card h2 { margin-bottom: 16px; }
        .faq-card h3 { margin-top: 32px; margin-bottom: 12px; }

        .faq-card li {
            margin-bottom: 10px;
            list-style: none;
        }

        .faq-card li::before { content: '✅ '; }

        .file-list-item {
            background: var(--light-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px 20px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color var(--transition-fast);
        }

        .file-list-item:hover { border-color: var(--primary); }

        .file-list-item .file-meta strong { display: block; margin-bottom: 2px; }

        .file-list-item .file-meta small { color: var(--gray); font-size: var(--font-size-sm); }

        .btn-remove {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: var(--font-size-sm);
            transition: background var(--transition-fast);
        }

        .btn-remove:hover { background: #dc2626; }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group select,
        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--light-bg);
            color: var(--text);
            font-size: var(--font-size-base);
            font-family: var(--font-base);
            transition: border-color var(--transition-fast), background var(--transition-base);
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }
    </style>
